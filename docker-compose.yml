
services:
  db:
    image: postgres:15-alpine
    container_name: gocluj_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./data/schema1.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: gocluj_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "5050:80"
    depends_on:
      - db

  backend:
    build: ./backend
    container_name: gocluj_backend
    restart: always
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    container_name: gocluj_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=${REACT_APP_API_URL}
    volumes:
      - ./frontend:/app
      - /app/node_modules
  # One-shot job, not started by `docker compose up`. Run it with:
  #   docker compose run --rm scraper
  scraper:
    build: ./scrape
    container_name: gocluj_scraper
    profiles: ["scraper"]
    depends_on:
      - backend
    # The scraper finishes and exits, so never restart it automatically
    restart: "no"
    environment:
      INGEST_URL: ${INGEST_URL:-}
      INGEST_TOKEN: ${INGEST_TOKEN:-}
      HTTPCACHE_ENABLED: ${HTTPCACHE_ENABLED:-0}
      OUTPUT_DIR: /data/out
      LOG_LEVEL: ${SCRAPER_LOG_LEVEL:-INFO}
    volumes:
      - scraper_data:/data
volumes:
  postgres_data:
  scraper_data: